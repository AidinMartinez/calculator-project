<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماشین‌حساب حرفه‌ای</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="ماشین حساب">
      <header class="topbar">
        <div>
          <p class="eyebrow">ماشین‌حساب</p>
          <h1>حساب‌گر <span>مدرن</span></h1>
        </div>
        <button id="themeBtn" class="icon-btn" title="تغییر تم" aria-label="تغییر تم">☼</button>
      </header>

      <div class="display" aria-live="polite">
        <div id="previous" class="previous"></div>
        <div id="display" class="current">0</div>
      </div>

      <div class="keys" id="keys">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="delete">⌫</button>
        <button class="key utility" data-action="percent">%</button>
        <button class="key operator" data-value="÷">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="×">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="−">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+">+</button>

        <button class="key zero" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>
      <p class="hint">می‌تونی از صفحه‌کلید هم استفاده کنی.</p>
    </section>

    <aside class="history-panel">
      <div class="history-heading">
        <div>
          <p class="eyebrow">آخرین محاسبات</p>
          <h2>تاریخچه</h2>
        </div>
        <button id="clearHistory" class="clear-history">پاک‌کردن</button>
      </div>
      <ul id="history" class="history-list">
        <li class="empty-history">هنوز محاسبه‌ای انجام نشده.</li>
      </ul>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
